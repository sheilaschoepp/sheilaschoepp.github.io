name: Audit theme upgrade

on:
  push:
    branches: [main, master]
    paths:
      - "Gemfile"
      - "_config.yml"
      - ".al-folio-overrides.yml"
      - "_includes/**"
      - "_layouts/**"
      - "_plugins/**"
      - "_sass/**"
      - "assets/**"
      - ".github/workflows/theme-upgrade-audit.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "Gemfile"
      - "_config.yml"
      - ".al-folio-overrides.yml"
      - "_includes/**"
      - "_layouts/**"
      - "_plugins/**"
      - "_sass/**"
      - "assets/**"
      - ".github/workflows/theme-upgrade-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Audit migration and reviewed local overrides
        run: |
          bundle exec al-folio upgrade audit
          bundle exec al-folio upgrade overrides audit --fail-on-stale
